services:
  frontend:
    build:
      context: ./purrscan-frontend
    container_name: purrscan-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./purrscan-frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  backend:
    build:
      context: ./purrscan-backend
    container_name: purrscan-backend
    ports:
      - "8000:8000"
    volumes:
      - ./purrscan-backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
